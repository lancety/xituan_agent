# ECS Services — full backend task env for staging/development via parameters.*.json.
# Production: set SkipEcsServicesCfnDeploy=true and use GitHub Actions deploy.yml instead.
AWSTemplateFormatVersion: '2010-09-09'
Description: 'Xituan ECS Services with ALB Integration'

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [development, staging, production]

  ECSClusterName:
    Type: String

  ECSSecurityGroupId:
    Type: String

  PublicSubnetId:
    Type: String

  RDSInstanceEndpoint:
    Type: String

  RDSInstancePort:
    Type: String

  BackendTargetGroupArn:
    Type: String

  DBUsername:
    Type: String
    Default: xituan_admin

  DBPassword:
    Type: String
    NoEcho: true

  DBName:
    Type: String
    Default: xituan

  CORSOrigin:
    Type: String
    Default: 'https://www.xituan.com'

  LogLevel:
    Type: String
    Default: warn
    AllowedValues: [debug, info, warn, error]

  SentryEnabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

  EcrImageTag:
    Type: String
    Default: latest
    Description: ECR image tag (staging should use staging; production often updated by CI)

  DatabaseUrl:
    Type: String
    NoEcho: true
    Default: ''

  JwtSecret:
    Type: String
    NoEcho: true
    Default: ''

  S3Key:
    Type: String
    NoEcho: true
    Default: ''

  S3SecretKey:
    Type: String
    NoEcho: true
    Default: ''

  S3Bucket:
    Type: String
    Default: ''

  WechatAppId:
    Type: String
    NoEcho: true
    Default: ''

  WechatAppSecret:
    Type: String
    NoEcho: true
    Default: ''

  PaymentConfigEncryptionKey:
    Type: String
    NoEcho: true
    Default: ''

  PaymentConfigEncryptionKeyPrevious:
    Type: String
    NoEcho: true
    Default: ''

  GoogleMapsApiKey:
    Type: String
    NoEcho: true
    Default: ''

  StripeSecretKey:
    Type: String
    NoEcho: true
    Default: ''

  StripePublishableKey:
    Type: String
    NoEcho: true
    Default: ''

  StripeWebhookSecret:
    Type: String
    NoEcho: true
    Default: ''

  StripeSubscriptionWebhookSecret:
    Type: String
    NoEcho: true
    Default: ''

  OmiMNumber:
    Type: String
    NoEcho: true
    Default: ''

  OmiKey:
    Type: String
    NoEcho: true
    Default: ''

  MultilingualSortIcu:
    Type: String
    Default: ''

  ZhHansSortIcuCollation:
    Type: String
    Default: ''

  OpenimApiInternalUrl:
    Type: String
    Default: ''
    Description: ECS OPENIM_API_BASE_URL (e.g. http://10.0.1.195:10002). Empty uses OpenimApiPublicUrl.

  OpenimApiPublicUrl:
    Type: String
    Default: ''
    Description: SDK apiBaseUrl (e.g. https://im-api.lancety.com)

  OpenimWsPublicUrl:
    Type: String
    Default: ''

  OpenimSecret:
    Type: String
    NoEcho: true
    Default: ''

  MinTaskCount:
    Type: Number
    Default: 1
    MinValue: 1

  MaxTaskCount:
    Type: Number
    Default: 3
    MinValue: 1

  TargetCPUUtilization:
    Type: Number
    Default: 80
    MinValue: 1
    MaxValue: 100

  TargetMemoryUtilization:
    Type: Number
    Default: 80
    MinValue: 1
    MaxValue: 100

Conditions:
  UseOpenimInternalApi: !Not [!Equals [!Ref OpenimApiInternalUrl, '']]

Resources:
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: Name
          Value: !Sub 'xituan-ecs-execution-role-${Environment}'

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Name
          Value: !Sub 'xituan-ecs-task-role-${Environment}'
      Policies:
        - PolicyName: ecs-exec-ssmmessages
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: '*'

  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub 'xituan-backend-${Environment}'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: 512
      Memory: 1024
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: backend
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/xituan-backend:${EcrImageTag}'
          PortMappings:
            - ContainerPort: 3050
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: !Ref Environment
            - Name: PORT
              Value: '3050'
            - Name: DB_HOST
              Value: !Ref RDSInstanceEndpoint
            - Name: DB_PORT
              Value: !Ref RDSInstancePort
            - Name: DB_USER
              Value: !Ref DBUsername
            - Name: DB_PASSWORD
              Value: !Ref DBPassword
            - Name: DB_NAME
              Value: !Ref DBName
            - Name: DATABASE_URL
              Value: !Ref DatabaseUrl
            - Name: CORS_ORIGIN
              Value: !Ref CORSOrigin
            - Name: LOG_LEVEL
              Value: !Ref LogLevel
            - Name: SWAGGER_ENABLED
              Value: 'false'
            - Name: SENTRY_ENABLED
              Value: !Ref SentryEnabled
            - Name: SENTRY_ENVIRONMENT
              Value: !Ref Environment
            - Name: SENTRY_SAMPLE_RATE
              Value: '0.1'
            - Name: S3_REGION
              Value: !Ref AWS::Region
            - Name: S3_KEY
              Value: !Ref S3Key
            - Name: S3_SECRET_KEY
              Value: !Ref S3SecretKey
            - Name: S3_BUCKET
              Value: !Ref S3Bucket
            - Name: WECHAT_APP_ID
              Value: !Ref WechatAppId
            - Name: WECHAT_APP_SECRET
              Value: !Ref WechatAppSecret
            - Name: PAYMENT_CONFIG_ENCRYPTION_KEY
              Value: !Ref PaymentConfigEncryptionKey
            - Name: PAYMENT_CONFIG_ENCRYPTION_KEY_PREVIOUS
              Value: !Ref PaymentConfigEncryptionKeyPrevious
            - Name: GOOGLE_MAPS_API_KEY
              Value: !Ref GoogleMapsApiKey
            - Name: JWT_SECRET
              Value: !Ref JwtSecret
            - Name: STRIPE_SECRET_KEY
              Value: !Ref StripeSecretKey
            - Name: STRIPE_PUBLISHABLE_KEY
              Value: !Ref StripePublishableKey
            - Name: STRIPE_WEBHOOK_SECRET
              Value: !Ref StripeWebhookSecret
            - Name: STRIPE_SUBSCRIPTION_WEBHOOK_SECRET
              Value: !Ref StripeSubscriptionWebhookSecret
            - Name: OMI_M_NUMBER
              Value: !Ref OmiMNumber
            - Name: OMI_KEY
              Value: !Ref OmiKey
            - Name: MULTILINGUAL_SORT_ICU
              Value: !Ref MultilingualSortIcu
            - Name: ZH_HANS_SORT_ICU_COLLATION
              Value: !Ref ZhHansSortIcuCollation
            - Name: OPENIM_API_BASE_URL
              Value: !If
                - UseOpenimInternalApi
                - !Ref OpenimApiInternalUrl
                - !Ref OpenimApiPublicUrl
            - Name: OPENIM_API_PUBLIC_URL
              Value: !Ref OpenimApiPublicUrl
            - Name: OPENIM_WS_PUBLIC_URL
              Value: !Ref OpenimWsPublicUrl
            - Name: OPENIM_SECRET
              Value: !Ref OpenimSecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend
          Essential: true

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/xituan-backend-${Environment}'
      RetentionInDays: 7

  BackendService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub 'xituan-backend-service-${Environment}'
      Cluster: !Ref ECSClusterName
      TaskDefinition: !Ref BackendTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      EnableExecuteCommand: true
      LoadBalancers:
        - TargetGroupArn: !Ref BackendTargetGroupArn
          ContainerName: backend
          ContainerPort: 3050
      NetworkConfiguration:
        AwsvpcConfiguration:
          SecurityGroups:
            - !Ref ECSSecurityGroupId
          Subnets:
            - !Ref PublicSubnetId
          AssignPublicIp: ENABLED
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 50
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      Tags:
        - Key: Name
          Value: !Sub 'xituan-backend-service-${Environment}'

  BackendScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: !Ref MaxTaskCount
      MinCapacity: !Ref MinTaskCount
      ResourceId: !Sub 'service/${ECSClusterName}/${BackendService.Name}'
      RoleARN: !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService'
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
    DependsOn: BackendService

  BackendCPUScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub 'cpu${TargetCPUUtilization}-${Environment}'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref BackendScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: !Ref TargetCPUUtilization
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleInCooldown: 60
        ScaleOutCooldown: 60

  BackendMemoryScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub 'mem${TargetMemoryUtilization}-${Environment}'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref BackendScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: !Ref TargetMemoryUtilization
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageMemoryUtilization
        ScaleInCooldown: 60
        ScaleOutCooldown: 60

Outputs:
  BackendServiceName:
    Description: Backend Service Name
    Value: !Ref BackendService

  BackendTaskDefinitionArn:
    Description: Backend Task Definition ARN
    Value: !Ref BackendTaskDefinition
